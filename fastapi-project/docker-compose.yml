version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: fastapi_project_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: fastapi_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_project_data:/var/lib/postgresql/data

volumes:
  postgres_project_data:
